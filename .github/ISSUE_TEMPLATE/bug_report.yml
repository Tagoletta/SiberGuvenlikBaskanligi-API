name: "🐛 Bug report / Hata bildirimi"
description: "Report a problem with the scraper, workflow, or generated lists. / Kazıyıcı, iş akışı veya üretilen listelerle ilgili bir sorunu bildirin."
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Teşekkürler! Lütfen aşağıdaki alanları doldurun. / Thanks! Please fill in the fields below.
  - type: textarea
    id: what-happened
    attributes:
      label: "Ne oldu? / What happened?"
      description: "Sorunu açıkça anlatın. / Clearly describe the problem."
      placeholder: "Örn. days-30-domains.txt boş üretiliyor. / e.g. days-30-domains.txt is generated empty."
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: "Yeniden üretme adımları / Steps to reproduce"
      description: "Sorunu nasıl tetiklediğinizi adım adım yazın. / List the steps that trigger the issue."
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: "Beklenen davranış / Expected behavior"
      description: "Ne olmasını bekliyordunuz? / What did you expect to happen?"
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: "Çalışma ortamı / Environment"
      description: "Sorunu nerede gözlemlediniz? / Where did you observe the issue?"
      options:
        - "GitHub Actions"
        - "Docker (docker compose)"
        - "Yerel / Local (python scraper/fetch.py)"
        - "Diğer / Other"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "İlgili günlükler / Relevant logs"
      description: "Varsa hata çıktısını buraya yapıştırın. / Paste any error output here."
      render: shell
    validations:
      required: false
